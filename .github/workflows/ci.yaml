name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # Gate each check on the paths it validates. Skipped jobs count as passed
  # for the required checks on master; a workflow-level `paths` filter would
  # leave them pending instead.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
      manifests: ${{ steps.filter.outputs.manifests }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            nix:
              - 'nix/**'
              - '.github/workflows/ci.yaml'
            manifests:
              - 'cluster/**'
              - 'nix/flake.lock'
              - '.github/workflows/ci.yaml'

  nix:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
      - name: flake check
        working-directory: nix
        run: nix flake check -L

  manifests:
    needs: changes
    if: needs.changes.outputs.manifests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
      - name: validate flux kustomizations
        run: |
          nix shell --inputs-from ./nix nixpkgs#kustomize nixpkgs#kubeconform --command bash -euo pipefail -c '
            for dir in cluster/infra/controllers cluster/infra/configs cluster/apps; do
              echo "::group::$dir"
              kustomize build "$dir" | kubeconform -summary -ignore-missing-schemas \
                -schema-location default \
                -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
              echo "::endgroup::"
            done
          '
