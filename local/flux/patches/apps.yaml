---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  patches:
    # These apps generate API keys in their local PVCs, independently of prod.
    # Seed this Secret from the local apps before verifying Homepage widgets.
    - target:
        kind: Deployment
        name: homepage
        namespace: homepage
      patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: homepage
          namespace: homepage
        spec:
          template:
            spec:
              containers:
                - name: homepage
                  env:
                    - name: HOMEPAGE_VAR_JELLYFIN_API_KEY
                      valueFrom:
                        secretKeyRef:
                          name: homepage-local-widget-credentials
                          key: JELLYFIN_API_KEY
                          optional: true
                    - name: HOMEPAGE_VAR_SEERR_API_KEY
                      valueFrom:
                        secretKeyRef:
                          name: homepage-local-widget-credentials
                          key: SEERR_API_KEY
                          optional: true
    # Explicit synthetic credentials override envFrom, so local Anker never
    # connects to the real Anki account. PostgreSQL is local already.
    - target:
        kind: Deployment
        name: anker
        namespace: anker
      patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: anker
          namespace: anker
        spec:
          template:
            spec:
              containers:
                - name: anker
                  env:
                    - name: ANKER_SYNC_URL
                      value: http://anki-sync.local-fixtures.svc.cluster.local:8080
                    - name: ANKER_USERNAME
                      value: demo
                    - name: ANKER_PASSWORD
                      value: demo
                    - name: ANKER_SYNC_INTERVAL
                      value: 1m
    # A second peer with prod's Mullvad WireGuard key would break prod's
    # tunnel, so gluetun connects to a local WireGuard server instead
    # (local/fixtures/vpn-endpoint.yaml) as a `custom` provider. The gluetun
    # Secret is not Flux's: local/cluster.sh creates it with generated keys
    # and the qBittorrent login from the arr secret.
    - patch: |-
        $patch: delete
        apiVersion: v1
        kind: Secret
        metadata:
          name: gluetun
          namespace: gluetun
    - target:
        kind: Deployment
        name: gluetun
      patch: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: gluetun
          namespace: gluetun
        spec:
          template:
            spec:
              initContainers:
                - name: gluetun
                  env:
                    - name: VPN_SERVICE_PROVIDER
                      value: custom
                    - name: SERVER_CITIES
                      $patch: delete
                    - name: WIREGUARD_ENDPOINT_IP
                      value: 10.43.0.51
                    - name: WIREGUARD_ENDPOINT_PORT
                      value: "51820"
                    - name: WIREGUARD_PUBLIC_KEY
                      valueFrom:
                        secretKeyRef:
                          name: gluetun
                          key: wireguard_public_key
              # Prod's WebUI login was set by hand; a fresh local PVC needs it
              # seeded (local/fixtures/qbittorrent-login.sh).
              containers:
                - name: qbittorrent
                  volumeMounts:
                    - name: qbittorrent-init
                      mountPath: /custom-cont-init.d
                      readOnly: true
                    - name: qbittorrent-login
                      mountPath: /run/qbittorrent-login
                      readOnly: true
              volumes:
                - name: qbittorrent-init
                  configMap:
                    name: qbittorrent-init
                    defaultMode: 0755
                - name: qbittorrent-login
                  secret:
                    secretName: gluetun
                    items:
                      - key: qbittorrent_username
                        path: qbittorrent_username
                      - key: qbittorrent_password
                        path: qbittorrent_password
    # Local certificates are self-signed (see infra-configs), so TLS to the
    # apps' ingress URLs cannot be validated. Sonarr/Prowlarr skip validation
    # for hosts that resolve to private addresses (CoreDNS hairpins them to
    # traefik's ClusterIP); curl and Configarr (Node) skip it entirely.
    # target: makes this a no-op where the CronJob does not exist (sync <ref>).
    - target:
        kind: CronJob
        name: arr-config
        namespace: arr
      patch: |-
        apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: arr-config
          namespace: arr
        spec:
          jobTemplate:
            spec:
              template:
                spec:
                  initContainers:
                    - name: host-config
                      env:
                        - name: CERT_VALIDATION
                          value: disabledForLocalAddresses
                        - name: CURL_INSECURE
                          value: "1"
                  containers:
                    - name: configarr
                      env:
                        - name: NODE_TLS_REJECT_UNAUTHORIZED
                          value: "0"
