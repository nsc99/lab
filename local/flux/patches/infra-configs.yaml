---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  patches:
    # Self-signed instead of Let's Encrypt: no ACME rate limits, no DNS-01
    # records in the real Cloudflare zone.
    - target:
        kind: ClusterIssuer
      patch: |-
        - op: replace
          path: /spec
          value:
            selfSigned: {}
    - patch: |-
        $patch: delete
        apiVersion: v1
        kind: Secret
        metadata:
          name: cloudflare
          namespace: cert-manager
    # Prod's ntfy topic and healthchecks.io ping URL: local alerts would reach
    # the phone and local Watchdog pings would mask prod being down. The Secret
    # is not Flux's: local/cluster.sh points it at local/fixtures/ntfy.yaml.
    # target: makes this a no-op where the Secret does not exist (sync <ref>).
    - target:
        kind: Secret
        name: grafana-alerting
        namespace: monitoring
      patch: |-
        $patch: delete
        apiVersion: v1
        kind: Secret
        metadata:
          name: grafana-alerting
    # Tailscale CRs; the operator is not installed locally.
    - patch: |-
        $patch: delete
        apiVersion: tailscale.com/v1alpha1
        kind: ProxyGroup
        metadata:
          name: ingress
    - patch: |-
        $patch: delete
        apiVersion: v1
        kind: Service
        metadata:
          name: traefik-public
          namespace: kube-system
    # Single node: required anti-affinity would leave the second instance Pending.
    - target:
        group: postgresql.cnpg.io
        kind: Cluster
        name: postgres
      patch: |-
        - op: replace
          path: /spec/affinity/podAntiAffinityType
          value: preferred
