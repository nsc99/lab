# Local-only stand-ins for external services prod depends on. Applied by
# local/cluster.sh with kubectl (not through Flux), together with the Secrets
# it generates for them; local/flux/patches points the workloads here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - anki-sync.yaml
  - vpn-endpoint.yaml
  - ntfy.yaml
images:
  - name: python
    newName: docker.io/library/python
    # renovate: datasource=docker depName=python
    newTag: 3.15.1-alpine
  - name: ntfy
    newName: binwiederhier/ntfy
    # renovate: datasource=docker depName=binwiederhier/ntfy
    newTag: v2.32.0
  - name: wireguard
    newName: lscr.io/linuxserver/wireguard
    # renovate: datasource=docker depName=lscr.io/linuxserver/wireguard versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)-r(?<build>\d+)-ls(?<revision>\d+)$
    newTag: 1.0.20260223-r0-ls125
configMapGenerator:
  - name: anki-sync
    namespace: local-fixtures
    files:
      - anki-sync.py
    options:
      disableNameSuffixHash: true
  # Mounted into qBittorrent's /custom-cont-init.d by the apps patch.
  - name: qbittorrent-init
    namespace: gluetun
    files:
      - qbittorrent-login.sh
    options:
      disableNameSuffixHash: true
