apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gluetun
  namespace: gluetun
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "qBittorrent"
    gethomepage.dev/group: "Services"
    gethomepage.dev/icon: "qbittorrent.svg"
    gethomepage.dev/description: "Download queue"
    gethomepage.dev/weight: "60"
    gethomepage.dev/pod-selector: "name=gluetun"
    gethomepage.dev/widget.type: "qbittorrent"
    gethomepage.dev/widget.url: "https://q.${EXTERNAL_DOMAIN}"
    gethomepage.dev/widget.fields: '["leech", "download", "seed", "upload"]'
    gethomepage.dev/widget.username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
    gethomepage.dev/widget.password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"
spec:
  ingressClassName: traefik
  tls:
    - secretName: qbittorrent-tls
      hosts:
        - q.${EXTERNAL_DOMAIN}
  rules:
    - host: q.${EXTERNAL_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  number: 8080
