---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: jellyfin
      version: v3.2.0
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: jellyfin
  releaseName: jellyfin
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deploymentStrategy:
      type: Recreate
    replicaCount: 1
    image:
      pullPolicy: IfNotPresent  
    ingress:
      enabled: true
      className: 'traefik'
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: jellyfin.${EXTERNAL_DOMAIN}
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: jellyfin-tls
          hosts:
            - jellyfin.${EXTERNAL_DOMAIN}
    persistence:
      config:
        existingClaim: jellyfin-config
      media:
        existingClaim: jellyfin-media
      cache:
        enabled: false
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        labels:
          release: observability
    nodeSelector:
      kubernetes.io/hostname: nix-optiplex2
