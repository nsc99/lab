apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mokuro-bunko
  namespace: mokuro-bunko
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Mokuro Bunko"
    gethomepage.dev/group: "Services"
    gethomepage.dev/icon: "mdi-book-open-page-variant"
    gethomepage.dev/description: "Read manga"
    gethomepage.dev/weight: "30"
    gethomepage.dev/pod-selector: "name=mokuro-bunko"
spec:
  ingressClassName: traefik
  tls:
    - secretName: mokuro-bunko-tls
      hosts:
        - bunko.${EXTERNAL_DOMAIN}
  rules:
    - host: bunko.${EXTERNAL_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mokuro-bunko
                port:
                  number: 8080
