---
# Media requests: sign-in with a Jellyfin account, requests go to
# Sonarr/Radarr. Exposed like Jellyfin. Jellyfin,
# Sonarr, Radarr and the request defaults are set up in the UI (settings.json
# on the config PVC); the database is the shared CNPG cluster.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: seerr
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: seerr-chart
      version: 3.10.0
      sourceRef:
        kind: HelmRepository
        name: seerr
        namespace: seerr
  releaseName: seerr
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: seerr
    config:
      persistence:
        storageClass: nfs-tank
        size: 1Gi
    extraEnv:
      - name: TZ
        value: Europe/Berlin
      - name: DB_TYPE
        value: postgres
      - name: DB_HOST
        value: postgres-rw.postgres.svc.cluster.local
      - name: DB_PORT
        value: "5432"
      - name: DB_NAME
        value: seerr
      - name: DB_USER
        value: seerr
      - name: DB_PASS
        valueFrom:
          secretKeyRef:
            name: seerr
            key: db_password
    serviceAccount:
      automount: false
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Seerr"
        gethomepage.dev/group: "Services"
        gethomepage.dev/icon: "seerr.svg"
        gethomepage.dev/description: "Media requests"
        gethomepage.dev/weight: "20"
        gethomepage.dev/pod-selector: "app.kubernetes.io/name=seerr-chart"
        gethomepage.dev/widget.type: "seerr"
        gethomepage.dev/widget.url: "https://seerr.${EXTERNAL_DOMAIN}"
        gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_SEERR_API_KEY}}"
        gethomepage.dev/widget.fields: '["pending", "processing", "completed"]'
        traefik.ingress.kubernetes.io/router.entrypoints: websecure,public
      hosts:
        - host: seerr.${EXTERNAL_DOMAIN}
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: seerr-tls
          hosts:
            - seerr.${EXTERNAL_DOMAIN}
