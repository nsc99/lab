# Configarr config (https://configarr.de). Flux substitutes EXTERNAL_DOMAIN; no
# other dollar signs may appear in this file.
# Secrets come from env (!env).
# All URLs go through the ingress; CoreDNS resolves *.EXTERNAL_DOMAIN to
# traefik inside the cluster (cluster/infra/configs/coredns).

sonarr:
  sonarr:
    base_url: https://sonarr.${EXTERNAL_DOMAIN}
    api_key: !env SONARR_API_KEY
    # Declarative: root folders not listed here are removed.
    root_folders:
      - /media/library/shows
      # Anime series requested through Seerr (its Sonarr "Anime Root Folder").
      - /media/library/anime
    # Anime profile (Seerr's Sonarr "Anime Quality Profile"): 1080p max, ranks
    # release groups, rejects LQ groups, dubs-only and AV1. Quality sizes are
    # global, so TRaSH's anime quality_definition is left out.
    #
    # Profiles for everything else, both keep the original audio (see the
    # overrides below):
    # - WEB-1080p (default, Seerr's Sonarr "Quality Profile"): original audio
    #   only, German releases rejected.
    # - [German] HD Bluray + WEB (per request): German + original audio
    #   (German DL) preferred, original-only accepted.
    include:
      - template: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
        source: TRASH
      - template: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        source: TRASH
      - template: dca7e5e9e99c703bcbdaaa471dd40e98 # [German] HD Bluray + WEB
        source: TRASH
    # Overrides of the TRaSH profiles (merged by name). Anime: min score 0
    # instead of 100, so groups TRaSH doesn't tier (e.g. Erai-raws without a
    # WEB source tag) are accepted; the -10000 formats stay rejected.
    quality_profiles:
      - name: "[Anime] Remux-1080p"
        min_format_score: 0
    custom_formats:
      - trash_ids:
          - b4a1b3d705159cdca36d71e57ca86871 # Anime Raws (unsubtitled is fine)
        assign_scores_to:
          - name: "[Anime] Remux-1080p"
            score: 0
      # Every release must carry the original language (Sonarr assumes the
      # series' original language when a release has no language tag). TRaSH's
      # German profile would otherwise upgrade English-only to a German-only
      # dub, replacing the original audio; a German dub only counts as German DL.
      - trash_ids:
          - ae575f95ab639ba5d15f663bf019e3e8 # Language: Not Original
        assign_scores_to:
          - name: WEB-1080p
            score: -10000
          - name: "[German] HD Bluray + WEB"
            score: -10000
      - trash_ids:
          - ed51973a811f51985f14e2f6f290e47a # German DL
          - c5dd0fd675f85487ad5bdf97159180bd # German DL (undefined)
        assign_scores_to:
          - name: WEB-1080p
            score: -10000
      - trash_ids:
          - 8a9fcdbb445f2add0505926df3bb7b8a # German (dub without original audio)
          - 133589380b89f8f8394320901529bac1 # Not German or English (non-English originals)
        assign_scores_to:
          - name: "[German] HD Bluray + WEB"
            score: 0
    download_clients:
      data:
        - name: qBittorrent
          type: qbittorrent
          enable: true
          fields:
            host: q.${EXTERNAL_DOMAIN}
            port: 443
            use_ssl: true
            username: !env QBITTORRENT_USERNAME
            password: !env QBITTORRENT_PASSWORD
            tv_category: tv-sonarr

radarr:
  radarr:
    base_url: https://radarr.${EXTERNAL_DOMAIN}
    api_key: !env RADARR_API_KEY
    # Declarative: root folders not listed here are removed.
    root_folders:
      - /media/library/movies
      # Anime movies (Seerr override rule on the TMDB keyword "anime").
      - /media/library/anime-movies
    # Anime profile (quality profile of Seerr's "anime" override rule).
    # Profiles for everything else, as in Sonarr: HD Bluray + WEB (default;
    # TRaSH sets its language to Original) and [German] HD Bluray + WEB.
    include:
      - template: 722b624f9af1e492284c4bc842153a38 # [Anime] Remux-1080p
        source: TRASH
      - template: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
        source: TRASH
      - template: 2b90e905c99490edc7c7a5787443748b # [German] HD Bluray + WEB
        source: TRASH
    # Same overrides as in Sonarr.
    quality_profiles:
      - name: "[Anime] Remux-1080p"
        min_format_score: 0
    custom_formats:
      - trash_ids:
          - 06b6542a47037d1e33b15aa3677c2365 # Anime Raws (unsubtitled is fine)
        assign_scores_to:
          - name: "[Anime] Remux-1080p"
            score: 0
      - trash_ids:
          - d6e9318c875905d6cfb5bee961afcea9 # Language: Not Original
        assign_scores_to:
          - name: "[German] HD Bluray + WEB"
            score: -10000
      - trash_ids:
          - f845be10da4f442654c13e1f2c3d6cd5 # German DL
          - 6aad77771dabe9d3e9d7be86f310b867 # German DL (undefined)
        assign_scores_to:
          - name: HD Bluray + WEB
            score: -10000
      - trash_ids:
          - 86bc3115eb4e9873ac96904a4a68e19e # German (dub without original audio)
          - 4eadb75fb23d09dfc0a8e3f687e72287 # Not German or English (non-English originals)
        assign_scores_to:
          - name: "[German] HD Bluray + WEB"
            score: 0
    download_clients:
      data:
        - name: qBittorrent
          type: qbittorrent
          enable: true
          fields:
            host: q.${EXTERNAL_DOMAIN}
            port: 443
            use_ssl: true
            username: !env QBITTORRENT_USERNAME
            password: !env QBITTORRENT_PASSWORD
            movie_category: radarr

prowlarr:
  prowlarr:
    base_url: https://prowlarr.${EXTERNAL_DOMAIN}
    api_key: !env PROWLARR_API_KEY
    # Prowlarr only routes indexers through the proxy that carry its tag.
    indexer_proxies:
      data:
        - name: FlareSolverr
          type: FlareSolverr
          fields:
            host: https://flaresolverr.${EXTERNAL_DOMAIN}/
            requestTimeout: 60
          tags:
            - flaresolverr
    applications:
      data:
        - name: Sonarr
          type: Sonarr
          sync_level: fullSync
          fields:
            prowlarrUrl: https://prowlarr.${EXTERNAL_DOMAIN}
            baseUrl: https://sonarr.${EXTERNAL_DOMAIN}
            apiKey: !env SONARR_API_KEY
            syncCategories: [5000, 5010, 5020, 5030, 5040, 5045, 5050, 5090]
            animeSyncCategories: [5070]
        - name: Radarr
          type: Radarr
          sync_level: fullSync
          fields:
            prowlarrUrl: https://prowlarr.${EXTERNAL_DOMAIN}
            baseUrl: https://radarr.${EXTERNAL_DOMAIN}
            apiKey: !env RADARR_API_KEY
            syncCategories: [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060, 2070, 2080, 2090]
