---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr
  namespace: arr
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Sonarr"
    gethomepage.dev/group: "Services"
    gethomepage.dev/icon: "sonarr.svg"
    gethomepage.dev/description: "Series library"
    gethomepage.dev/weight: "70"
    gethomepage.dev/widget.type: "sonarr"
    gethomepage.dev/widget.url: "https://sonarr.${EXTERNAL_DOMAIN}"
    gethomepage.dev/widget.fields: '["series", "wanted", "queued"]'
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
spec:
  ingressClassName: traefik
  tls:
    - secretName: sonarr-tls
      hosts:
        - sonarr.${EXTERNAL_DOMAIN}
  rules:
    - host: sonarr.${EXTERNAL_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarr
                port:
                  number: 8080
