---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr
  namespace: arr
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Radarr"
    gethomepage.dev/group: "Services"
    gethomepage.dev/icon: "radarr.svg"
    gethomepage.dev/description: "Movie library"
    gethomepage.dev/weight: "80"
    gethomepage.dev/widget.type: "radarr"
    gethomepage.dev/widget.url: "https://radarr.${EXTERNAL_DOMAIN}"
    gethomepage.dev/widget.fields: '["movies", "wanted", "queued"]'
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
spec:
  ingressClassName: traefik
  tls:
    - secretName: radarr-tls
      hosts:
        - radarr.${EXTERNAL_DOMAIN}
  rules:
    - host: radarr.${EXTERNAL_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  number: 8080
