---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: arr
  labels:
    app.kubernetes.io/name: radarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: radarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radarr
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-postgres
          image: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/wait-for-postgres.sh", "radarr-main", "radarr-log"]
          securityContext:
            runAsUser: 26
            runAsGroup: 26
            runAsNonRoot: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          env:
            - name: PGHOST
              value: postgres-rw.postgres.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: radarr
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: arr
                  key: radarr_db_password
            - name: PGCONNECT_TIMEOUT
              value: "3"
          volumeMounts:
            - name: wait-for-postgres
              mountPath: /scripts
              readOnly: true
      containers:
        - name: radarr
          image: ghcr.io/linuxserver/radarr:6.4.4.10685-ls320
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          env:
            - name: TZ
              value: Europe/Berlin
            - name: PUID
              value: "2000"
            - name: PGID
              value: "2000"
            - name: RADARR__POSTGRES__HOST
              value: postgres-rw.postgres.svc.cluster.local
            - name: RADARR__POSTGRES__PORT
              value: "5432"
            - name: RADARR__POSTGRES__USER
              value: radarr
            - name: RADARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arr
                  key: radarr_db_password
            - name: RADARR__POSTGRES__MAINDB
              value: radarr-main
            - name: RADARR__POSTGRES__LOGDB
              value: radarr-log
            - name: RADARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: arr
                  key: radarr_api_key
            # Case-sensitive enum parsing: an invalid value silently falls back to config.xml.
            - name: RADARR__AUTH__METHOD
              value: Forms
            - name: RADARR__AUTH__REQUIRED
              value: Enabled
          ports:
            - name: http
              containerPort: 7878
              protocol: TCP
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: radarr-config
              mountPath: /config
            - name: radarr-media
              mountPath: /media
      volumes:
        - name: "radarr-config"
          persistentVolumeClaim:
            claimName: radarr-config
        - name: "radarr-media"
          nfs:
            server: ${NFS_HOST}
            path: /tank/media
        - name: "wait-for-postgres"
          configMap:
            name: wait-for-postgres
