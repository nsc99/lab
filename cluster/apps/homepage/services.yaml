- Study:
    - Anki:
        widget:
          type: iframe
          src: /anki-study.html
          classes: h-60
          referrerPolicy: same-origin
          loadingStrategy: eager
- Services:
    - Public access:
        icon: mdi-web-check
        href: https://dashboard.uptimerobot.com/
        description: External HTTPS availability through netcup-chiller
        widget:
          type: uptimerobot
          url: "{{HOMEPAGE_VAR_UPTIMEROBOT_URL}}"
          key: "{{HOMEPAGE_VAR_UPTIMEROBOT_API_KEY}}"
          fields: ["status", "uptime", "lastDown", "downDuration"]
