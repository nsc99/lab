---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - rbac.yaml
  - secret.yaml
configMapGenerator:
  # The name hash rolls the Deployment when configuration changes.
  - name: homepage-config
    files:
      - settings.yaml
      - kubernetes.yaml
      - widgets.yaml
      - custom.css
      - custom.js
      - offline.html
      - sw.js
      # Flux excludes JPEG filenames from source artifacts. Preserve the JPEG
      # bytes as a deployment asset and mount it under its normal public name.
      - background.jpeg=background.asset
    literals:
      - 'bookmarks.yaml=[]'
      - 'docker.yaml={}'
      - 'services.yaml=[]'
      - 'proxmox.yaml={}'
