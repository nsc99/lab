---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - rbac.yaml
configMapGenerator:
  # The name hash rolls the Deployment when configuration changes.
  - name: homepage-config
    files:
      - settings.yaml
      - kubernetes.yaml
      - widgets.yaml
      - custom.css
      - custom.js
    literals:
      - 'bookmarks.yaml=[]'
      - 'docker.yaml={}'
      - 'services.yaml=[]'
      - 'proxmox.yaml={}'
