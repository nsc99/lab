---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - rbac.yaml
  - secret.yaml
configMapGenerator:
  # The name hash rolls the Deployment when configuration changes.
  - name: homepage-config
    options:
      annotations:
        # Static assets contain JavaScript template expressions, not Flux vars.
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - settings.yaml
      - kubernetes.yaml
      - widgets.yaml
      - services.yaml
      - custom.css
      - custom.js
      - anki-study.html
      - anki-study.css
      - anki-study.mjs
      - offline.html
      - sw.js
      # Flux excludes JPEG filenames from source artifacts. Preserve the JPEG
      # bytes as a deployment asset and mount it under its normal public name.
      - background.jpeg=background.asset
    literals:
      - 'bookmarks.yaml=[]'
      - 'docker.yaml={}'
      - 'proxmox.yaml={}'
