---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
          # The image ships a prerendered demo page. Regenerate it from our
          # mounted config on every start, before Kubernetes marks it ready.
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -ec
                  - |
                    for attempt in $(seq 1 60); do
                      if wget -qO /dev/null http://127.0.0.1:3000/api/healthcheck; then
                        exec wget -qO- http://127.0.0.1:3000/api/revalidate
                      fi
                      sleep 1
                    done
                    exit 1
          envFrom:
            - prefix: HOMEPAGE_VAR_
              secretRef:
                name: homepage-widget-credentials
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: lab.${EXTERNAL_DOMAIN}
            - name: HOSTNAME
              value: 0.0.0.0
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/healthcheck
              port: http
              httpHeaders:
                - name: Host
                  value: localhost:3000
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
              httpHeaders:
                - name: Host
                  value: localhost:3000
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
              httpHeaders:
                - name: Host
                  value: localhost:3000
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: logs
              mountPath: /app/config/logs
            # Mount individual public files; keep Homepage's bundled assets.
            - name: config
              mountPath: /app/public/anki-study.html
              subPath: anki-study.html
              readOnly: true
            - name: config
              mountPath: /app/public/anki-study.css
              subPath: anki-study.css
              readOnly: true
            - name: config
              mountPath: /app/public/anki-study.mjs
              subPath: anki-study.mjs
              readOnly: true
            - name: config
              mountPath: /app/public/sw.js
              subPath: sw.js
              readOnly: true
            - name: config
              mountPath: /app/public/offline.html
              subPath: offline.html
              readOnly: true
            - name: config
              mountPath: /app/public/background.jpeg
              subPath: background.jpeg
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: homepage-config
        - name: logs
          emptyDir:
            sizeLimit: 50Mi
