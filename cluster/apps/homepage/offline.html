<!doctype html>

<title>Junk Lab · Not connected</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #17191c; color: #edece8; font: 16px/1.6 system-ui, sans-serif; }
  main { width: 100%; max-width: 640px; padding: 48px 24px; }
  .label { color: #e99a74; font: 11px ui-monospace, monospace; letter-spacing: .16em; }
  h1 { font: clamp(40px, 8vw, 64px)/1.1 Georgia, serif; letter-spacing: -.04em; margin: 28px 0; }
  p { color: #aaa9a3; max-width: 44ch; }
  a { display: inline-block; color: #e99a74; margin: 16px 0 32px; text-underline-offset: 5px; }
  form { border-top: 1px solid #383d45; padding-top: 24px; }
  label { display: block; color: #aaa9a3; font-size: 13px; margin-bottom: 10px; }
  .search { display: flex; gap: 8px; }
  input, button { border: 1px solid #383d45; border-radius: 8px; background: #202328; color: #edece8; padding: 12px; font: inherit; }
  input { flex: 1; min-width: 0; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid #e99a74; outline-offset: 4px; }
</style>
<main>
  <div class="label">JUNK LAB / OFFLINE</div>
  <h1>Not connected<br>to the lab.</h1>
  <p>This page is saved on your device. Connect to your home network or tailnet to reach your apps.</p>

  <form action="https://duckduckgo.com/" method="get">
