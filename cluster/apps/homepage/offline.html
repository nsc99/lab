<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<script>
  const browserTheme = window.matchMedia("(prefers-color-scheme: dark)");
  let preference = "system";
  try { preference = localStorage.getItem("homepage-theme-preference") || "system"; } catch { /* Follow the browser without storage. */ }
  function applyTheme() {
    const light = preference === "light" || (preference === "system" && !browserTheme.matches);
    document.documentElement.classList.toggle("light", light);
  }
  browserTheme.addEventListener("change", applyTheme);
  applyTheme();
</script>
<link rel="icon" href="data:,">
<title>Junk Lab · Not connected</title>
<style>
  * { box-sizing: border-box; }
  :root {
    color-scheme: dark;
    --ink: #f6f0ec;
    --muted: #c4b8b8;
    --accent: #f3ba9d;
    --background: #171318;
    --overlay: linear-gradient(#14101855, #14101899);
    --card: #211b26a6;
    --line: #ffffff24;
    --shadow: inset 0 1px 0 #ffffff0a, 0 4px 18px #00000018;
  }
  :root.light {
    color-scheme: light;
    --ink: #302a2b;
    --muted: #625354;
    --accent: #8c4229;
    --background: #f3ede8;
    --overlay: linear-gradient(#f8f1e8a6, #f3e9e0cc);
    --card: #fffaf3db;
    --line: #5d3f422b;
    --shadow: inset 0 1px 0 #ffffffb3, 0 4px 18px #49342b12;
  }
  html { background: var(--background); }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 14px; color: var(--ink); font: 14px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body::before { content: ""; position: fixed; inset: -8px; z-index: -1; background: var(--overlay), url("/background.jpeg") center / cover no-repeat; filter: blur(3px); }
  main { width: 100%; max-width: 440px; padding: 28px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: var(--shadow); }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  h1 { margin: 20px 0 12px; font-size: clamp(24px, 6vw, 30px); line-height: 1.2; font-weight: 500; letter-spacing: -.035em; }
  p { margin: 0; color: var(--muted); }
</style>
<main aria-labelledby="message">
  <div class="status">unavailable</div>
  <h1 id="message">Not connected to the lab.</h1>
</main>
</html>
