<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>Junk Lab · Not connected</title>
<style>
  * { box-sizing: border-box; }
  html { background: #171318; color-scheme: dark; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 14px; color: #f6f0ec; font: 14px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body::before { content: ""; position: fixed; inset: -8px; z-index: -1; background: linear-gradient(#14101855, #14101899), url("/background.jpeg") center / cover no-repeat; filter: blur(3px); }
  main { width: 100%; max-width: 440px; padding: 28px; border: 1px solid #ffffff24; border-radius: 14px; background: #211b26a6; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 #ffffff0a, 0 4px 18px #00000018; }
  .status { display: flex; align-items: center; gap: 8px; color: #c4b8b8; font-size: 11px; }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #f3ba9d; }
  h1 { margin: 20px 0 12px; font-size: clamp(24px, 6vw, 30px); line-height: 1.2; font-weight: 500; letter-spacing: -.035em; }
  p { margin: 0; color: #c4b8b8; }
  a { display: inline-flex; align-items: center; gap: 16px; margin-top: 24px; padding: 10px 14px; border: 1px solid #f3ba9d66; border-radius: 9px; background: #ffffff0a; color: #f6f0ec; text-decoration: none; }
  a:hover { border-color: #f3ba9d; background: #ffffff12; }
  a:focus-visible { outline: 2px solid #f3ba9d; outline-offset: 4px; }
</style>
<main aria-labelledby="message">
  <div class="status">unavailable</div>
  <h1 id="message">Not connected to the lab.</h1>
</main>
</html>
