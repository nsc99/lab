---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
---
# Homepage v2.5.0 enumerates Ingresses across namespaces. Link-only entries
# (external: true) do not query pods or metrics; no other API access is needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage-ingress-discovery
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage-ingress-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage-ingress-discovery
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage
