---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
---
# Ingress discovery and native per-service health/CPU/memory stats.
# Read-only lists only: no Secrets, logs, exec or mutation permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage-ingress-discovery
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage-ingress-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage-ingress-discovery
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage
