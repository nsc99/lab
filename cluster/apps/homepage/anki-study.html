<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anki study activity</title>
<link rel="stylesheet" href="/anki-study.css">
<script type="module" src="/anki-study.mjs"></script>
<main aria-labelledby="heading">
  <header>
    <div><h1 id="heading">Anki</h1><p id="summary">Study activity</p></div>
    <div class="today"><span>Studied today</span><strong id="study-time" aria-live="polite">—</strong></div>
  </header>
  <div id="calendar" tabindex="0" role="region" aria-label="Study activity for the past year; scroll to see all days"></div>
  <footer>
    <p id="status" role="status">Loading study history…</p>
    <div class="legend" aria-label="Heat map intensity: fewer to more reviews">
      Less <i data-level="0"></i><i data-level="1"></i><i data-level="2"></i><i data-level="3"></i><i data-level="4"></i> More
    </div>
  </footer>
</main>
</html>
