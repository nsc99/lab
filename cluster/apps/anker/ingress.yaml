apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-anki-prefix
spec:
  stripPrefix:
    prefixes: [/anki]
---
# Only the read-only activity API shares Homepage's private origin.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: anker
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: anker-strip-anki-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  # Traefik's shared certificate store already has Homepage's certificate.
  tls:
    - hosts:
        - lab.${EXTERNAL_DOMAIN}
  rules:
    - host: lab.${EXTERNAL_DOMAIN}
      http:
        paths:
          - path: /anki/activity
            pathType: Exact
            backend:
              service:
                name: anker
                port:
                  name: http
