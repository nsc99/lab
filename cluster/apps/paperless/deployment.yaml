---
# paperless-ngx: one container running the web server, the Celery worker and
# beat, and the consumer (s6). Beat, the consumer and migrations must run
# once, hence one replica and Recreate.
#
# Valkey, Tika and Gotenberg are reached by their in-namespace Service names,
# not ingress URLs (second exception to that rule next to Postgres): they are
# unauthenticated backends and must never get an ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
  labels:
    app.kubernetes.io/name: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless
    spec:
      # A Service named paperless would inject PAPERLESS_PORT=tcp://...
      enableServiceLinks: false
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          # Batch node next to the disks; anywhere else is fine too.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [nix-optiplex1]
      securityContext:
        # Non-root mode: the image skips its recursive chown (which fails on
        # the all_squash export) and runs the services without s6-setuidgid.
        # 4000 is what the export squashes writes to. No USERMAP_*.
        runAsNonRoot: true
        runAsUser: 4000
        runAsGroup: 4000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:3.3.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 3Gi
          env:
            - name: S6_READ_ONLY_ROOT
              value: "1"
            - name: PAPERLESS_URL
              value: https://paperless.${EXTERNAL_DOMAIN}
            - name: PAPERLESS_PORT
              value: "8000"
            - name: PAPERLESS_TIME_ZONE
              value: Europe/Berlin
            # Behind traefik: rate-limit logins per X-Forwarded-For IP, not traefik's.
            # With externalTrafficPolicy Cluster that is the SNATed node IP, not the client.
            - name: PAPERLESS_ALLAUTH_TRUSTED_PROXY_COUNT
              value: "1"
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless
                  key: secret_key
            - name: PAPERLESS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: paperless
                  key: admin_user
            # First start only: never changes an existing user's password.
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless
                  key: admin_password
            - name: PAPERLESS_DBENGINE
              value: postgresql
            - name: PAPERLESS_DBHOST
              value: postgres-rw.postgres.svc.cluster.local
            - name: PAPERLESS_DBPORT
              value: "5432"
            - name: PAPERLESS_DBNAME
              value: paperless
            - name: PAPERLESS_DBUSER
              value: paperless
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless
                  key: db_password
            - name: PAPERLESS_REDIS
              value: redis://valkey:6379
            - name: PAPERLESS_TIKA_ENABLED
              value: "true"
            - name: PAPERLESS_TIKA_ENDPOINT
              value: http://tika:9998
            - name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT
              value: http://gotenberg:3000
            # jpn comes from /tank/documents/tessdata (mounted below);
            # PAPERLESS_OCR_LANGUAGES would apt-get install as root on every start.
            # jpn first: with deu first Tesseract dropped whole kana lines of a
            # mixed page (measured on lima); German pages read the same either way.
            - name: PAPERLESS_OCR_LANGUAGE
              value: jpn+deu+eng
            # Otherwise inferred from the first OCR language (jpn: no stemmer).
            - name: PAPERLESS_SEARCH_LANGUAGE
              value: de
            - name: PAPERLESS_DATE_PARSER_LANGUAGES
              value: de+en+ja
            # Without it Tesseract puts a space between Japanese characters, and
            # the search index only takes CJK runs of 2+ characters: nothing
            # Japanese would be searchable.
            - name: PAPERLESS_OCR_USER_ARGS
              value: '{"tesseract_config": ["/etc/paperless-tesseract/cjk.cfg"]}'
            # inotify does not see writes from other NFS clients.
            - name: PAPERLESS_CONSUMER_POLLING_INTERVAL
              value: "10"
            # The default is the host's cpu_count() / workers.
            - name: PAPERLESS_THREADS_PER_WORKER
              value: "2"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # No health endpoint; ALLOWED_HOSTS always accepts localhost, not the pod IP.
          startupProbe:
            httpGet:
              path: /accounts/login/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            # Migrations and index rebuilds after upgrades keep :8000 closed.
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /accounts/login/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /accounts/login/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: documents
              mountPath: /usr/src/paperless/media
              subPath: media
            - name: documents
              mountPath: /usr/src/paperless/data
              subPath: data
            - name: documents
              mountPath: /usr/src/paperless/consume
              subPath: consume
            - name: documents
              mountPath: /usr/src/paperless/export
              subPath: export
            - name: documents
              mountPath: /usr/share/tesseract-ocr/5/tessdata/jpn.traineddata
              subPath: tessdata/jpn.traineddata
              readOnly: true
            - name: documents
              mountPath: /usr/share/tesseract-ocr/5/tessdata/jpn_vert.traineddata
              subPath: tessdata/jpn_vert.traineddata
              readOnly: true
            - name: tesseract-config
              mountPath: /etc/paperless-tesseract
              readOnly: true
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tesseract-config
          configMap:
            name: paperless-tesseract
        - name: documents
          persistentVolumeClaim:
            claimName: paperless-documents
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
