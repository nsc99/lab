---
# LAN/tailnet only: no `public` entrypoint.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless
  namespace: paperless
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Paperless"
    gethomepage.dev/group: "Services"
    gethomepage.dev/icon: "paperless-ngx.svg"
    gethomepage.dev/description: "Documents and OCR"
    gethomepage.dev/weight: "110"
spec:
  ingressClassName: traefik
  tls:
    - secretName: paperless-tls
      hosts:
        - paperless.${EXTERNAL_DOMAIN}
  rules:
    - host: paperless.${EXTERNAL_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperless
                port:
                  number: 8000
