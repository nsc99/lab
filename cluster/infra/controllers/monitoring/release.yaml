---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: monitoring
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 91.9.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  releaseName: observability
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
    
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false

    # Grafana Alerting sends the notifications (cluster/infra/configs/monitoring/
    # grafana-alerting.yaml); Prometheus only evaluates the rules.
    alertmanager:
      enabled: false
    defaultRules:
      rules:
        alertmanager: false
      disabled:
        PrometheusNotConnectedToAlertmanagers: true

    prometheus:
      prometheusSpec:
        scrapeInterval: 1m
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi

    grafana:
      persistence:
        enabled: true
        size: 2Gi

      admin:
        existingSecret: grafana
        userKey: admin_username
        passwordKey: admin_password

      # Links in notifications.
      grafana.ini:
        server:
          root_url: https://grafana.${EXTERNAL_DOMAIN}

      sidecar:
        alerts:
          enabled: true
        datasources:
          alertmanager:
            enabled: false

      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-prod"
        hosts:
          - grafana.${EXTERNAL_DOMAIN}
        path: /
        pathType: Prefix
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.${EXTERNAL_DOMAIN}