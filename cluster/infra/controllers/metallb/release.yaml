---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: metallb
      version: v0.16.1
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: metallb-system
  releaseName: metallb
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    speaker:
      frr:
        enabled: false
    frrk8s:
      enabled: false
