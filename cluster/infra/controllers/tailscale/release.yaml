---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: tailscale-operator
      version: 1.102.4
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: tailscale
  releaseName: tailscale-operator
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    operatorConfig:
      hostname: k8s-operator
