---
apiVersion: v1
kind: Service
metadata:
  name: traefik-public
  namespace: kube-system
  annotations:
    tailscale.com/proxy-group: ingress
    tailscale.com/hostname: traefik-public
    tailscale.com/tags: tag:k8s-public
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-kube-system
  ports:
    - name: public
      port: 8443
      targetPort: public
